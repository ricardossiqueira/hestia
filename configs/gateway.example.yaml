gateway:
  id: orangepi-lab-01
  timezone: America/Sao_Paulo

mqtt:
  url: mqtt://127.0.0.1:1883
  client_id: iot-gateway-orangepi-lab-01
  username_env: MQTT_GATEWAY_USERNAME
  password_env: MQTT_GATEWAY_PASSWORD

storage:
  sqlite_path: /var/lib/iot-gateway/gateway.db
  max_outbox_messages: 10000
  max_outbox_bytes: 33554432
  max_outbox_age: 168h

# Local-only operational API. It never exposes MQTT payloads, credentials,
# topic names or device identifiers. The following values are also defaults.
diagnostics:
  address: 127.0.0.1:8080
  request_timeout: 2s

# Optional and off by default (omit this whole section to disable it).
# Unlike diagnostics, this is a LAN-reachable, mutating Connect-RPC
# endpoint (gRPC, gRPC-Web and HTTP/JSON on one port) - see docs/api-v1.md
# and deploy/README.md. Requires IOT_GATEWAY_API_USERNAME and
# IOT_GATEWAY_API_PASSWORD. LAN-trusted only, never port-forward.
# Port 8082, not 8081: the admin UI (a separate process, deploy/README.md)
# already defaults to 8081.
# api:
#   address: 0.0.0.0:8082
#   # Optional: exact allowlist of browser origins (never "*") permitted to
#   # call the API cross-origin with credentials, e.g. a gateway-web dev
#   # server. Absent/empty means CORS stays off - no Access-Control-*
#   # headers are ever added, and a browser cannot call this API
#   # cross-origin at all. See docs/api-v1.md.
#   cors_allowed_origins:
#     - http://localhost:5173
#     - http://127.0.0.1:5173

devices:
  - id: esp32-sala
    type: esp32
    enabled: true
    # profile: led.v1  # optional; enables schema validation via internal/deviceprofile (see docs/api-v1.md). Empty/absent = opaque fallback.
    topics:
      telemetry: devices/esp32-sala/telemetry
      state: devices/esp32-sala/state
      event: devices/esp32-sala/event
      command: devices/esp32-sala/command
      command_result: devices/esp32-sala/command-result
    forwarding:
      telemetry_to_vps: true
      state_to_vps: true
      events_to_vps: true
      commands_from_vps: true
