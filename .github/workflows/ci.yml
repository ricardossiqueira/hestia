name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: bufbuild/buf-action@v1
        with:
          version: 1.73.0
          setup_only: true

      - name: Check generated Protobuf API
        run: |
          buf lint
          buf generate
          git diff --exit-code -- api/gen/go

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  publish-image:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/arm64 via QEMU emulation - slower than native, but this runs
      # on GitHub-hosted infrastructure with no memory pressure, unlike the
      # Orange Pi this image is actually for. The Pi only ever pulls the
      # finished image (see orangepi-deploy's Quadlet units); nothing
      # builds on it anymore.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/ricardossiqueira/iot-gateway:${{ github.sha }}
            ghcr.io/ricardossiqueira/iot-gateway:latest
