syntax = "proto3";

package iot.gateway.api.v1;

option go_package = "github.com/ricardossiqueira/iot-gateway/api/gen/go/iot/gateway/api/v1;apiv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// DeviceService lists configured devices, describes the commands each one
// accepts, and publishes commands to them. See docs/api-v1.md.
service DeviceService {
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc ListDeviceCommands(ListDeviceCommandsRequest) returns (ListDeviceCommandsResponse);
  // ListDeviceEvents describes the events a device may emit, the same way
  // ListDeviceCommands describes what it accepts. Marco 5's automation
  // rules use this to let an operator pick a source device's event type
  // instead of typing it blind.
  rpc ListDeviceEvents(ListDeviceEventsRequest) returns (ListDeviceEventsResponse);
  rpc PublishCommand(PublishCommandRequest) returns (PublishCommandResponse);
  // GetDeviceTelemetry returns the most recent accepted telemetry message
  // for a device, cached in memory only (no history, no persistence - see
  // docs/api-v1.md). available=false means nothing has been received yet
  // since this process started, not an error.
  rpc GetDeviceTelemetry(GetDeviceTelemetryRequest) returns (GetDeviceTelemetryResponse);
  // TestAutomationRule runs one automation rule through the live pipeline
  // with an operator-supplied payload standing in for the source device's
  // event - it lives here, not on DeviceAdminService, because only this
  // sandboxed process holds the live MQTT connection needed to actually
  // publish the resulting action command (see docs/api-v1.md).
  rpc TestAutomationRule(TestAutomationRuleRequest) returns (TestAutomationRuleResponse);
}

// GatewayService reports the gateway's own runtime status.
service GatewayService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // GetQueueSummary reads the outbox's current pending state (not the
  // lifetime counters GetStatus already reports) - see docs/api-v1.md.
  rpc GetQueueSummary(GetQueueSummaryRequest) returns (GetQueueSummaryResponse);
  // GetRecentEvents returns the in-memory activity log - accepted/rejected
  // messages and local route outcomes, no payload, capped and forgotten on
  // restart. See docs/api-v1.md's "Atividade recente".
  rpc GetRecentEvents(GetRecentEventsRequest) returns (GetRecentEventsResponse);
}

// DeviceAdminService registers, enables/disables and removes devices - the
// privileged operations internal/admin implements (a JSON/HTML UI on port
// 8081 used to expose these too; retired once gateway-web reached parity
// with it, see docs/decisions.md ADR-015). See ADR-013 for why this is
// answered directly by the admin (root) process instead of being proxied
// like DeviceService/GatewayService are.
service DeviceAdminService {
  // RegisterExistingDevice adopts a known broker identity without generating
  // or rotating a password. It is for local services installed separately
  // from the gateway, such as orangepi-monitor.
  rpc RegisterExistingDevice(RegisterExistingDeviceRequest) returns (RegisterExistingDeviceResponse);
	// Routes belong to the same versioned SQLite policy as devices. They are
  // applied by the live gateway without restarting either systemd service.
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  rpc CreateRoute(CreateRouteRequest) returns (CreateRouteResponse);
  rpc RemoveRoute(RemoveRouteRequest) returns (RemoveRouteResponse);
  // ListDeviceManifests exposes only published family definitions. Draft
  // editing/publishing is deliberately a later milestone.
  rpc ListDeviceManifests(ListDeviceManifestsRequest) returns (ListDeviceManifestsResponse);
  rpc GetDeviceManifest(GetDeviceManifestRequest) returns (GetDeviceManifestResponse);
  rpc ListDeviceManifestBindings(ListDeviceManifestBindingsRequest) returns (ListDeviceManifestBindingsResponse);
  rpc MigrateDeviceToManifest(MigrateDeviceToManifestRequest) returns (MigrateDeviceToManifestResponse);
  rpc CreateDeviceManifestDraft(CreateDeviceManifestDraftRequest) returns (CreateDeviceManifestDraftResponse);
  rpc CreateDeviceManifestRevisionDraft(CreateDeviceManifestRevisionDraftRequest) returns (CreateDeviceManifestRevisionDraftResponse);
  rpc PublishDeviceManifest(PublishDeviceManifestRequest) returns (PublishDeviceManifestResponse);
  // ProvisionDeviceByIP provisions an unprovisioned device using a published
  // http-nvs-v1 manifest. The MQTT password is delivered directly to NVS and
  // never appears in this API response.
  rpc ProvisionDeviceByIP(ProvisionDeviceByIPRequest) returns (ProvisionDeviceByIPResponse);
  rpc SetDeviceEnabled(SetDeviceEnabledRequest) returns (SetDeviceEnabledResponse);
  rpc RemoveDevice(RemoveDeviceRequest) returns (RemoveDeviceResponse);
  // ListInconsistencies returns provisioning operations whose best-effort
  // compensation itself failed - the registry and the Mosquitto broker now
  // disagree about a device. Empty is the healthy state. See docs/api-v1.md.
  rpc ListInconsistencies(ListInconsistenciesRequest) returns (ListInconsistenciesResponse);
  rpc ResolveInconsistency(ResolveInconsistencyRequest) returns (ResolveInconsistencyResponse);
  // Automation rules (Marco 5, docs/device-manifests.md): "when source
  // device emits event_type, if condition passes, publish this command to
  // action device". Rules are edited in place; their ID is immutable.
  rpc ListAutomationRules(ListAutomationRulesRequest) returns (ListAutomationRulesResponse);
  rpc CreateAutomationRule(CreateAutomationRuleRequest) returns (CreateAutomationRuleResponse);
  rpc UpdateAutomationRule(UpdateAutomationRuleRequest) returns (UpdateAutomationRuleResponse);
  rpc SetAutomationRuleEnabled(SetAutomationRuleEnabledRequest) returns (SetAutomationRuleEnabledResponse);
  rpc RemoveAutomationRule(RemoveAutomationRuleRequest) returns (RemoveAutomationRuleResponse);
}

message RegisterExistingDeviceRequest {
  string device_id = 1;
  string template = 2;
}

message RegisterExistingDeviceResponse {
  Device device = 1;
  google.protobuf.Timestamp applied_at = 2;
}

message Route {
  string id = 1;
  string source_topic = 2;
  string destination_topic = 3;
  string command_type = 4;
  uint32 qos = 5;
  bool retain = 6;
}

message ListRoutesRequest {}

message ListRoutesResponse {
  repeated Route routes = 1;
}

message CreateRouteRequest {
  Route route = 1;
}

message CreateRouteResponse {
  Route route = 1;
  google.protobuf.Timestamp applied_at = 2;
}

message RemoveRouteRequest {
  string route_id = 1;
}

message RemoveRouteResponse {
  google.protobuf.Timestamp applied_at = 1;
}

// DeviceManifest is canonical JSON stored in the registry. It contains
// declarative compatibility, MQTT topics and capabilities, never secrets or
// executable configuration.
message DeviceManifest {
  string id = 1;
  string display_name = 2;
  uint64 revision = 3;
  string document_json = 4;
  string created_by = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListDeviceManifestsRequest {}

message ListDeviceManifestsResponse {
  repeated DeviceManifest manifests = 1;
}

message GetDeviceManifestRequest {
  string manifest_id = 1;
}

message GetDeviceManifestResponse {
  DeviceManifest manifest = 1;
}

// DeviceManifestBinding identifies exactly the published definition used
// when a device was provisioned. Legacy devices have no binding.
message DeviceManifestBinding {
  string device_id = 1;
  string manifest_id = 2;
  uint64 manifest_revision = 3;
}

message ListDeviceManifestBindingsRequest {}

message ListDeviceManifestBindingsResponse {
  repeated DeviceManifestBinding bindings = 1;
}
message MigrateDeviceToManifestRequest { string device_id = 1; string manifest_id = 2; }
message MigrateDeviceToManifestResponse { Device device = 1; google.protobuf.Timestamp applied_at = 2; }

message CreateDeviceManifestDraftRequest {
  string document_json = 1;
}

message CreateDeviceManifestDraftResponse {
  DeviceManifest manifest = 1;
}

message CreateDeviceManifestRevisionDraftRequest {
  string manifest_id = 1;
  string document_json = 2;
}

message CreateDeviceManifestRevisionDraftResponse {
  DeviceManifest manifest = 1;
}

message PublishDeviceManifestRequest {
  string manifest_id = 1;
  uint64 revision = 2;
}

message PublishDeviceManifestResponse {
  DeviceManifest manifest = 1;
}

message ProvisionDeviceByIPRequest {
  string device_id = 1;
  string manifest_id = 2;
  // Private IPv4 printed by the firmware before its first MQTT connection.
  string device_ip = 3;
}

message ProvisionDeviceByIPResponse {
  Device device = 1;
  string device_ip = 2;
  string manifest_id = 3;
  google.protobuf.Timestamp applied_at = 4;
}

message SetDeviceEnabledRequest {
  string device_id = 1;
  bool enabled = 2;
}

message SetDeviceEnabledResponse {
  Device device = 1;
  google.protobuf.Timestamp applied_at = 2;
}

message RemoveDeviceRequest {
  string device_id = 1;
}

message RemoveDeviceResponse {
  google.protobuf.Timestamp applied_at = 1;
}

// Inconsistency mirrors internal/registry.Inconsistency 1:1. See
// docs/api-v1.md's "Inconsistências de provisionamento".
message Inconsistency {
  string id = 1;
  // kind identifies which operation failed to compensate, e.g.
  // "provision_cyd", "provision_led", "provision_device",
  // "set_device_enabled", "remove_device".
  string kind = 2;
  string device_id = 3;
  // cause is what triggered the original rollback attempt.
  string cause = 4;
  // compensation_error is why the rollback itself also failed.
  string compensation_error = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListInconsistenciesRequest {}

message ListInconsistenciesResponse {
  repeated Inconsistency inconsistencies = 1;
}

message ResolveInconsistencyRequest {
  string id = 1;
}

message ResolveInconsistencyResponse {}

// AutomationRule mirrors internal/registry.AutomationRule 1:1. No revision
// history: it is edited in place (create/remove, or toggled by enabled),
// the same mutability model Route already uses.
message AutomationRule {
  string id = 1;
  bool enabled = 2;
  string source_device_id = 3;
  string event_type = 4;
  // condition_json is empty when the rule has no condition (always fires).
  // A supported subset of JSONLogic - see internal/automationrule.
  string condition_json = 5;
  string action_device_id = 6;
  string action_command_type = 7;
  string action_parameters_json = 8;
  // action_schema_validated is false when the action device has no
  // manifest binding - same meaning as PublishCommandResponse's field.
  bool action_schema_validated = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message ListAutomationRulesRequest {}

message ListAutomationRulesResponse {
  repeated AutomationRule rules = 1;
}

message CreateAutomationRuleRequest {
  AutomationRule rule = 1;
}

message CreateAutomationRuleResponse {
  AutomationRule rule = 1;
  google.protobuf.Timestamp applied_at = 2;
}

message UpdateAutomationRuleRequest {
  AutomationRule rule = 1;
}

message UpdateAutomationRuleResponse {
  AutomationRule rule = 1;
  google.protobuf.Timestamp applied_at = 2;
}

message SetAutomationRuleEnabledRequest {
  string rule_id = 1;
  bool enabled = 2;
}

message SetAutomationRuleEnabledResponse {
  AutomationRule rule = 1;
  google.protobuf.Timestamp applied_at = 2;
}

message RemoveAutomationRuleRequest {
  string rule_id = 1;
}

message RemoveAutomationRuleResponse {
  google.protobuf.Timestamp applied_at = 1;
}

message ListDevicesRequest {}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message Device {
  string id = 1;
  string type = 2;
  bool enabled = 3;
  DeviceTopics topics = 5;
}

message DeviceTopics {
  string telemetry = 1;
  string state = 2;
  string event = 3;
  string command = 4;
  string command_result = 5;
}

message ListDeviceCommandsRequest {
  string device_id = 1;
}

message ListDeviceCommandsResponse {
  string device_id = 1;
  // schema_validated is false when the device has no manifest binding:
  // commands is then empty and PublishCommand accepts parameters opaquely.
  bool schema_validated = 2;
  repeated CommandDescriptor commands = 3;
}

// CommandDescriptor is the manifest JSON schema for one command type.
message CommandDescriptor {
  string type = 1;
  string parameters_json = 4;
}

message ListDeviceEventsRequest {
  string device_id = 1;
}

message ListDeviceEventsResponse {
  string device_id = 1;
  // schema_validated is false when the device has no manifest binding:
  // events is then empty - same meaning as ListDeviceCommandsResponse's field.
  bool schema_validated = 2;
  repeated EventDescriptor events = 3;
}

// EventDescriptor is the manifest JSON schema for one event type.
message EventDescriptor {
  string type = 1;
  string payload_json = 2;
}

message PublishCommandRequest {
  string device_id = 1;
  string type = 2;
  // parameters is a Struct, not bytes (contrast
  // api/proto/iot/gateway/uplink/v1/uplink.proto's *_json bytes fields):
  // a bytes field is base64 in JSON, which would defeat curl/simple-form
  // clients - the entire point of this API. The cost is Struct's number
  // precision (JSON numbers decode as double): acceptable because
  // parameters are validated and recodified against a schema right after
  // decoding. See docs/decisions.md ADR-012. An integer parameter above
  // 2^53 must be declared `string` in its command message.
  google.protobuf.Struct parameters = 3;
}

message PublishCommandResponse {
  string command_id = 1;
  string device_id = 2;
  // schema_validated is false when the device published opaquely (no
  // manifest binding) - the same meaning as ListDeviceCommandsResponse's field.
  bool schema_validated = 3;
  google.protobuf.Timestamp published_at = 4;
}

message TestAutomationRuleRequest {
  string rule_id = 1;
  // payload is a Struct for the same reason PublishCommandRequest.parameters
  // is (ADR-012): plain JSON in/out, no base64 for simple/curl clients.
  google.protobuf.Struct payload = 2;
}

message TestAutomationRuleResponse {
  // fired is true only when the condition matched and the action command
  // was actually published to the real action device - this runs the rule
  // through the live pipeline (internal/mqtt.Gateway.fireAutomationRule),
  // it does not simulate it.
  bool fired = 1;
  // reason explains the outcome either way: "fired" on success, or why not
  // otherwise ("condition not met", "rate limited", "rule is disabled",
  // etc - see internal/mqtt.Gateway.fireAutomationRule).
  string reason = 2;
  google.protobuf.Timestamp tested_at = 3;
}

message GetDeviceTelemetryRequest {
  string device_id = 1;
}

message GetDeviceTelemetryResponse {
  string device_id = 1;
  // available is false when the gateway has not accepted a telemetry
  // message for this device since the process started. payload and
  // observed_at are unset in that case - this is not an error.
  bool available = 2;
  // payload is a Struct, not bytes - same reasoning as
  // PublishCommandRequest.parameters (ADR-012): keeps this readable over
  // plain curl/HTTP-JSON instead of becoming base64.
  google.protobuf.Struct payload = 3;
  // observed_at is the payload's own `timestamp` field (already validated
  // RFC3339 UTC by internal/mqtt), not when this RPC was called.
  google.protobuf.Timestamp observed_at = 4;
}

message GetStatusRequest {}

// GetStatusResponse mirrors internal/mqtt.Snapshot field for field.
message GetStatusResponse {
  google.protobuf.Timestamp started_at = 1;
  bool started = 2;
  bool mqtt_connected = 3;
  int32 subscriptions = 4;
  uint64 accepted_messages = 5;
  uint64 rejected_messages = 6;
  uint64 local_routes_published = 7;
  uint64 local_routes_failed = 8;
  uint64 outbox_stored = 9;
  uint64 outbox_discarded = 10;
  uint64 outbox_failed = 11;
}

message GetQueueSummaryRequest {}

// GetQueueSummaryResponse mirrors internal/outbox.Snapshot field for field -
// the outbox's current pending state, not the lifetime counters
// GetStatusResponse already reports (outbox_stored/discarded/failed).
message GetQueueSummaryResponse {
  uint64 pending_messages = 1;
  int64 pending_bytes = 2;
  // Unset when pending_messages is 0.
  google.protobuf.Timestamp oldest_enqueued_at = 3;
}

// ActivityEvent mirrors internal/mqtt.ActivityEvent 1:1. Never a payload -
// see docs/api-v1.md's "Atividade recente".
message ActivityEvent {
  // sequence is monotonically increasing - a stable pagination cursor (see
  // GetRecentEventsRequest.before_sequence) and a stable UI list key.
  uint64 sequence = 7;
  google.protobuf.Timestamp timestamp = 1;
  string device_id = 2;
  // kind is empty for a route_published/route_failed outcome.
  string kind = 3;
  string topic = 4;
  // outcome is one of "accepted", "rejected", "route_published",
  // "route_failed".
  string outcome = 5;
  // detail is the rejection reason, or the route ID (plus failure cause
  // for route_failed) - never a payload.
  string detail = 6;
}

message GetRecentEventsRequest {
  // device_id, if set, only returns events for that device.
  string device_id = 1;
  // since, if set, excludes events older than it.
  google.protobuf.Timestamp since = 2;
  // limit caps the page size; unset/0 means the server default (50, see
  // docs/api-v1.md), always capped at 200.
  uint32 limit = 3;
  // before_sequence, if set, only considers events with a strictly
  // smaller sequence - the pagination cursor for "next page" (pass the
  // last event's sequence from the previous response).
  uint64 before_sequence = 4;
}

message GetRecentEventsResponse {
  // Most recent first, one page (see GetRecentEventsRequest.limit).
  repeated ActivityEvent events = 1;
  // has_more is true when older matching events exist beyond this page.
  bool has_more = 2;
}
