syntax = "proto3";

package iot.device.led.v1;

option go_package = "github.com/ricardossiqueira/iot-gateway/api/gen/go/iot/device/led/v1;ledv1";

// SetLed is the led.v1 device profile's only command. `optional` turns on
// proto3 explicit presence tracking: without it, {} and {"on": false}
// would be indistinguishable and an empty command would silently mean
// "turn off". See internal/deviceprofile.ValidateAndCanonicalize, which
// rejects any command missing a field declared optional here.
message SetLed {
  optional bool on = 1;
}
